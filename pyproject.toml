[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vecman"
version = "3.0.0"
description = "Learned embedding compression and compressed vector search (product-quantized VQ-VAE)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Loaii abdalslam", email = "loaiabdalslam@gmail.com" },
]
keywords = ["vector-database", "embeddings", "vq-vae", "product-quantization", "retrieval", "rag"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21",
    "torch>=2.0.0",
    "sentence-transformers>=2.2.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
rag = ["google-generativeai>=0.8.0"]
eval = ["ragas>=0.1.0", "datasets>=2.20.0", "pandas>=1.5"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/Vec1man/vecman"
Repository = "https://github.com/Vec1man/vecman"
Changelog = "https://github.com/Vec1man/vecman/blob/main/CHANGELOG.md"

[project.scripts]
vecman = "vecman.cli:main"

[tool.setuptools.packages.find]
include = ["vecman*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
